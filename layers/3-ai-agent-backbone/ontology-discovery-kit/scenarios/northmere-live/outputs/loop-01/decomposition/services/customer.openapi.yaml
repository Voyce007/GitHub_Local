openapi: 3.0.3
info:
  title: Customer business services
  version: 0.1.0
  description: Ontology-based access layer for the Customer domain. Generated stub for review.
paths:
  /register-customer:
    post:
      summary: Register Customer
      operationId: registerCustomer
      description: Business service. Replaces PRC_REGISTER_PERSON in TAXCORE.
      responses:
        '200':
          description: Done
  /record-life-events:
    post:
      summary: Record Life Events
      operationId: recordLifeEvents
      description: Business service. Replaces PRC_CLOSE_DECEASED in TAXCORE.
      responses:
        '200':
          description: Done
  /person/{id}:
    get:
      summary: Get Person
      operationId: getPerson
      description: 'Used by: Childcare, National Insurance, PAYE'
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Person
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Person'
components:
  schemas:
    Person:
      type: object
      properties:
        personId:
          type: integer
        nationalInsuranceNumber:
          type: string
        forename:
          type: string
        surname:
          type: string
        dateOfBirth:
          type: string
          format: date
        dateOfDeath:
          type: string
          format: date
        correspondencePreference:
          type: string
    Address:
      type: object
      properties:
        personId:
          type: integer
        addressType:
          type: string
        addressLine1:
          type: string
        postcode:
          type: string
        personRef:
          type: string
x-events:
- name: PersonChanged
  consumers:
  - National Insurance
  - Childcare
  replaces:
  - PRC_CLOSE_DECEASED writing NiRecord
  - PRC_CLOSE_DECEASED writing ChildcareAccount
