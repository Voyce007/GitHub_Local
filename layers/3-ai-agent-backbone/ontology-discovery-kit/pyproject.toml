[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ontokit"
version = "0.5.1"
description = "Evidence-graded ontology discovery and monolith decomposition pipeline for the Enterprise Ontology Playbook agents"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
reports = ["openpyxl>=3.1", "python-docx>=1.1"]
license = { text = "Same licence as the repository that ships it" }

[tool.setuptools]
packages = ["ontokit"]
