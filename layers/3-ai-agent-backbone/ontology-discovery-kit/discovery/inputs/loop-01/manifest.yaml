# Evidence batch manifest — one per loop.
# Every file the agents may cite must be listed here. Provenance sets the
# highest grade a file can support: only real-code / schema / data-sample reach A.
#
# SAMPLE DATA: "Example Group" and every system name below are fictional and
# industry-agnostic. The sample covers what most companies have: customers,
# products and orders, plus the group functions Finance and Risk. It is written
# to exercise the workflow: aliases, contradictions, a stale document, an
# undocumented system and a homonym. Replace this folder with your own extracts.

batch: loop-01
received: 2026-11-22
organisation: Example Group (fictional sample)
description: >
  First evidence batch. As-is documentation extracts plus illustrative code
  examples supplied by support teams. No real source code, schemas or data
  samples are available yet.
staleness_years: 5          # documents older than this (vs `received`) are treated as stale

