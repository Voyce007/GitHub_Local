# Evidence batch manifest — one per loop.
# Every file the agents may cite must be listed here. Provenance drives the
# evidence grade ceiling: only real-code / schema / data-sample can reach A.
#
# SAMPLE DATA: "Northbridge Bank" and all system names below are fictional,
# written to exercise the workflow (aliases, contradictions, stale docs,
# unknown systems). Replace this whole folder with your own extracts.

batch: loop-01
received: 2026-11-22
organisation: Northbridge Bank (fictional sample)
description: >
  First evidence batch. As-is documentation extracts plus illustrative code
  examples supplied by support teams. No real source code, schemas or data
  samples are available yet.
staleness_years: 5          # documents older than this (vs `received`) are treated as stale

files:
  - path: docs/customer-onboarding-process.md
    provenance: document
    doc_type: process
    date: 2022-03-14
    author: Operations Design
    sensitivity: internal

